<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>mediatest</title>
<body style="margin:0;background:#112"><button id=b style="width:100vw;height:100vh;font-size:64px">TAP TO PLAY</button>
<script>
const tracks=[{title:'Test Track One',artist:'The Testers',album:'Album A'},{title:'Test Track Two',artist:'The Testers',album:'Album A'}];let ti=0,a=null;
function wav(){const sr=22050,n=sr*30,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++){const t=i/sr,beat=(t*2)%1,kick=Math.exp(-beat*8)*Math.sin(2*Math.PI*(60+90*Math.exp(-beat*20))*beat),sweep=0.25*Math.sin(2*Math.PI*(200+(t%6)*400)*t),hat=(Math.random()*2-1)*0.12*Math.exp(-((t*4)%1)*12);
const s=0.5*kick+sweep+hat;v.setInt16(44+i*2,Math.max(-1,Math.min(1,s))*20000,true)}return new Blob([buf],{type:'audio/wav'})}
function meta(){navigator.mediaSession.metadata=new MediaMetadata(Object.assign({},tracks[ti],{artwork:[{src:'art.png',sizes:'256x256',type:'image/png'}]}))}
b.onclick=async()=>{if(a)return;a=new Audio(URL.createObjectURL(wav()));a.loop=true;await a.play();meta();b.textContent='PLAYING (no skip handlers)';

}
</script>
