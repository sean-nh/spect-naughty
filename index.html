<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectr-Acular</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#cfd6e4;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;transition:opacity .8s}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(5,6,10,.92);z-index:5;text-align:center;padding:24px}
  #start h1{margin:0;font-size:clamp(28px,5vw,56px);letter-spacing:.04em}
  #start p{margin:0;max-width:640px;opacity:.7;font-size:clamp(14px,2vw,20px);line-height:1.4}
  button{font:inherit;color:#fff;background:#1f6feb;border:0;border-radius:16px;padding:18px 34px;font-size:clamp(18px,3vw,28px);cursor:pointer;min-height:64px}
  button.alt{background:#2a2f3d}
  button.alt.on{background:#1f6feb}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:16px 20px;align-items:center;justify-content:center;flex-wrap:wrap;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8) 35%);z-index:4;transition:opacity .4s}
  #bar.hide{opacity:0;pointer-events:none}
  #bar label{display:flex;align-items:center;gap:12px;font-size:24px}
  #bar button{padding:12px 24px;font-size:24px;min-height:64px;min-width:96px}
  #gainwrap{transition:opacity .2s}
  input[type=range]{-webkit-appearance:none;appearance:none;width:200px;height:56px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:#3a4156}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:#4f8cff;margin-top:-16px;border:3px solid #fff}
  #msg{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:22px;color:#ffb86b;z-index:6;pointer-events:none}
  #badge{position:fixed;left:10px;top:8px;font-size:14px;opacity:.6;z-index:6;pointer-events:none}
  /* small, dim clock in the top-right corner; a little brighter while the controls are showing */
  #clock{position:fixed;top:14px;right:22px;font-size:30px;font-weight:300;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#9aa6c0;opacity:.6;z-index:3;pointer-events:none;text-shadow:0 0 10px rgba(0,0,0,.85);transition:opacity .4s}
  #clock.hi{opacity:.9}
  /* Performance: Light also drops the blurred card background, which is costly on weak screens */
  body.perf #np{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(8,10,16,.82)}
  /* now playing card */
  #np{position:fixed;left:16px;top:34px;max-width:62vw;display:flex;gap:18px;align-items:center;padding:14px 20px 14px 14px;border-radius:22px;background:rgba(8,10,16,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:3;pointer-events:none}
  #npart{width:104px;height:104px;border-radius:14px;object-fit:cover;background:#1a1f2b;flex:none;display:none;transition:opacity .3s}
  #np.paused #npart{opacity:.45}
  #nptxt{min-width:0;display:flex;flex-direction:column;gap:2px}
  #npt{font-size:30px;font-weight:650;line-height:1.15;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #npa{font-size:22px;color:#b9c3d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #npapp{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#6fb3ff}
  /* song progress: elapsed time, a thin bar in the theme colour, total time. Read-only, hidden when the length is unknown (live streams) */
  #npp{display:none;align-items:center;gap:10px;margin-top:8px;min-width:300px;font-size:15px;color:#9aa6c0;font-variant-numeric:tabular-nums}
  #np.hasprog #npp{display:flex}
  #np.bare #npp{display:none}
  #npbar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  #npfill{height:100%;width:0;border-radius:3px;background:var(--acc,#6fb3ff)}
  #npctl{display:none;gap:12px;margin-top:10px}
  #np.ctl #npctl{display:flex}
  /* no song info (access off, or nothing playing): show just the buttons, and only while the controls are showing */
  #np.bare{display:none}
  #np.bare.ctl{display:flex}
  #np.bare #npart,#np.bare #npt,#np.bare #npa,#np.bare #npapp{display:none}
  #np.bare #npctl{margin-top:0}
  #npctl button{min-width:84px;min-height:64px;padding:0 20px;border-radius:16px;pointer-events:auto}
  #npctl svg{width:34px;height:34px;fill:#fff;display:block;margin:auto}
  #idle{position:fixed;left:0;right:0;top:42%;text-align:center;font-size:clamp(20px,3vw,34px);letter-spacing:.12em;opacity:0;z-index:3;pointer-events:none;transition:opacity .6s;color:#9aa6c0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="badge"></div>
<div id="idle">WAITING FOR MUSIC&hellip;</div>
<div id="clock"></div>
<div id="np">
  <img id="npart" alt="">
  <div id="nptxt">
    <div id="npt"></div><div id="npa"></div><div id="npapp"></div>
    <div id="npp"><span id="npe">0:00</span><div id="npbar"><div id="npfill"></div></div><span id="npd">0:00</span></div>
    <div id="npctl">
      <button id="prev" class="alt" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
      <button id="pp" class="alt" aria-label="Play or pause"></button>
      <button id="next" class="alt" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
    </div>
  </div>
</div>
<div id="start">
  <h1>SPECTR-ACULAR</h1>
  <p>Plays along with whatever your radio is playing. Tap Start listening and allow audio access when asked.</p>
  <button id="go">Start listening</button>
  <button id="demo" class="alt">Demo</button>
</div>
<div id="bar" class="hide">
  <label id="gainwrap">Gain <input id="gain" type="range" min="0.5" max="6" step="0.1" value="2.5"></label>
  <button id="auto" class="alt">Auto gain</button>
  <label>Bars <input id="bars" type="range" min="16" max="96" step="8" value="48"></label>
  <button id="style" class="alt">Style</button>
  <button id="theme" class="alt">Theme</button>
  <button id="src" class="alt">Source</button>
  <button id="perf" class="alt">Performance</button>
  <button id="clk" class="alt">Clock</button>
  <button id="npen" class="alt" style="display:none">Enable Now Playing</button>
  <button id="full" class="alt">Fullscreen</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,perfOn=false; // perfOn = "Performance: Light" (lower resolution, 30 fps, no glow)
function resize(){dpr=Math.min(window.devicePixelRatio||1,perfOn?1:2);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
addEventListener('resize',resize);resize();

// ---------- settings (remembered between launches) ----------
const styles=['Bars','Mirror','Radial','Wave','Tunnel','Gauge','Waterfall','Particles'];
// the last theme, "Album", takes its colours from the cover art of the song that is playing
const themes=[{n:'Aurora',a:200,b:360},{n:'Fire',a:0,b:55},{n:'Ocean',a:165,b:235},{n:'Neon',a:290,b:120},{n:'Ice',a:185,b:220},{n:'Album',a:200,b:260}];
const S={gain:2.5,bars:48,style:0,theme:0,auto:true,src:'auto',perf:false,clock:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('spect.settings')||'{}'))}catch(_){}
S.style=Math.max(0,Math.min(styles.length-1,S.style|0));
S.theme=Math.max(0,Math.min(themes.length-1,S.theme|0));
S.bars=Math.max(16,Math.min(96,S.bars|0))||48;
function save(){try{localStorage.setItem('spect.settings',JSON.stringify(S))}catch(_){}}
let toastT;function toast(t,ms){$('msg').textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>$('msg').textContent='',ms||2200)}
function syncUI(){
  $('gain').value=S.gain;$('bars').value=S.bars;
  $('auto').textContent='Auto gain: '+(S.auto?'On':'Off');$('auto').classList.toggle('on',S.auto);
  $('gainwrap').style.opacity=S.auto?.4:1;
  $('style').textContent='Style: '+styles[S.style];$('theme').textContent='Theme: '+themes[S.theme].n;
  $('perf').textContent='Performance: '+(S.perf?'Light':'Normal');$('perf').classList.toggle('on',S.perf);
  $('clk').textContent='Clock: '+(S.clock?'On':'Off');$('clk').classList.toggle('on',S.clock);
}
syncUI();if(window.Capacitor)$('full').style.display='none';

// ---------- state ----------
let audioCtx,analyser,freq,mode='none',t0=performance.now();
let vals=[],peaks=[],bass=0,bassAvg=0,flash=0;
let srcRate=48000,srcFft=4096,natHandle=null,natStart=0,natSeen=false,natErr='';
let agRef=0.3,gEff=S.gain,idleT=0,idleMix=0,badgeOn=false,badgeN=0,lastNow=performance.now();
let rings=[],lastSpawn=0;
const FFT=4096;

// ---------- audio sources ----------
async function startMicOnly(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=FFT;analyser.smoothingTimeConstant=0.6;
    src.connect(analyser);freq=new Uint8Array(analyser.frequencyBinCount);srcRate=audioCtx.sampleRate;srcFft=FFT;
    mode='mic';begin();
  }catch(e){
    $('msg').textContent='Audio unavailable: '+(e.name||e.message)+'. '+(natErr?'Direct audio: '+natErr+'. ':'')+'Try Demo, or check the audio permission.';
    $('start').style.display='flex';
  }
}
function begin(){
  $('start').style.display='none';$('bar').classList.remove('hide');hideLater();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(_){}
}
// Direct tap of Android's audio output (Visualizer API) via native plugin, using Capacitor's built-in bridge calls
const nat=(m,o)=>window.Capacitor.nativePromise('SpectVisualizer',m,o||{});
async function startNative(){
  for(let i=0;i<50&&!(window.Capacitor&&window.Capacitor.nativePromise&&window.Capacitor.addListener);i++)await new Promise(r=>setTimeout(r,100)); // bridge can load a moment late
  const C=window.Capacitor;
  if(!C||!C.nativePromise||!C.addListener)throw new Error('not in app');
  if(natHandle){try{await natHandle.remove()}catch(_){}natHandle=null}
  natHandle=C.addListener('SpectVisualizer','fft',e=>{
    const bin=atob(e.fft),size=bin.length,half=size>>1,out=new Uint8Array(half);
    const sb=i=>{const x=bin.charCodeAt(i);return x>127?x-256:x};
    for(let k=0;k<half;k++){
      const m=k===0?Math.abs(sb(0)):Math.hypot(sb(2*k),sb(2*k+1));
      out[k]=Math.max(0,Math.min(255,(255*Math.log10(1+m)/2.26-25)*255/230));
    }
    freq=out;if(out.some(x=>x>8))natSeen=true;
  });
  for(let i=0;;i++){ // wait for the user to allow audio access (asked by the app at launch)
    if((await nat('granted')).granted)break;
    if(i===0)toast('Allow audio access to start');
    if(i>120)throw new Error('audio permission not granted');
    await new Promise(r=>setTimeout(r,500));
  }
  const r=await nat('start');
  srcRate=r.sampleRate||48000;srcFft=r.captureSize||1024;
  freq=new Uint8Array(srcFft>>1);natSeen=false;natStart=performance.now();
  mode='native';begin();
}
async function stopNative(){try{await nat('stop')}catch(_){}}
async function startAuto(){
  if(S.src==='mic'||!window.Capacitor)return startMicOnly();
  try{await startNative()}
  catch(e){natErr=(e&&(e.message||e.errorMessage))||String(e);await startMicOnly()}
}
async function toggleSource(){
  if(mode==='native'){
    S.src='mic';await stopNative();
    if(analyser)mode='mic';else await startMicOnly();
  }else if(window.Capacitor){
    S.src='auto';
    try{await startNative()}catch(e){toast('Direct audio unavailable: '+(e.message||e))}
  }
  save();toast(mode==='native'?'Source: direct audio':'Source: microphone');
}
$('go').onclick=startAuto;
$('demo').onclick=()=>{mode='demo';begin();np={title:'Demo Track',artist:'Spectr-Acular',album:'',app:'Demo',playing:true,art:'',pos:62000,dur:213000,speed:1,t0:performance.now()};npRender()};

// ---------- spectrum ----------
function demoSpectrum(n){
  const t=(performance.now()-t0)/1000,beat=(t*2)%1,kick=Math.pow(1-beat,4);
  const out=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=i/n;
    let v=kick*Math.exp(-x*5)*1.0 + 0.35*Math.exp(-x*2)*(0.5+0.5*Math.sin(t*1.3+i*.4));
    v+=0.25*(0.5+0.5*Math.sin(t*5+i*.7))*(1-x)*((Math.floor(t*4)%2)?1:.4);
    v+=0.08*Math.random();out[i]=Math.max(0,Math.min(1,v));
  }
  return out;
}
// returns un-gained spectrum, 0..~1.5, log-spaced bars
function rawSpectrum(n){
  if(mode==='mic')analyser.getByteFrequencyData(freq);
  const sr=srcRate,binHz=sr/srcFft,L=freq.length;
  const lo=30,hi=Math.min(16000,sr/2),out=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=i/n,f1=lo*Math.pow(hi/lo,x),f2=lo*Math.pow(hi/lo,(i+1)/n);
    let v;
    if(f2-f1<binHz){ // bar narrower than one FFT bin: interpolate so the bass isn't blocky
      const pos=Math.sqrt(f1*f2)/binHz,b=Math.floor(pos),fr=pos-b;
      v=((freq[b]||0)*(1-fr)+(freq[Math.min(b+1,L-1)]||0)*fr)/255;
    }else{
      const b1=Math.floor(f1/binHz),b2=Math.max(b1+1,Math.ceil(f2/binHz));let s=0,c=0,m=0;
      for(let b=b1;b<b2&&b<L;b++){s+=freq[b];c++;if(freq[b]>m)m=freq[b]}
      v=(c?(s/c*0.4+m*0.6):0)/255;
    }
    v*=0.8+0.9*x;                          // gentle tilt so highs are visible
    v*=1+0.9*Math.max(0,1-x/0.3);          // bass lift so the kick still hits
    out[i]=Math.pow(Math.min(v,1.5),1.4);
  }
  return out;
}

const hue=(i,n)=>{const t=themes[S.theme];return t.a+(t.b-t.a)*(i/n)};

// ---------- drawing ----------
let lastFrame=0,fps=60,slowMs=0,slowHinted=false;
function draw(){
  requestAnimationFrame(draw);
  const ft=performance.now();
  if(perfOn&&ft-lastFrame<30)return; // Light mode: about 30 frames per second
  const ivl=ft-lastFrame;lastFrame=ft;
  if(ivl>0&&ivl<250){ // measure the real frame rate, and suggest Light mode once if the screen is struggling
    fps+=(1000/ivl-fps)*0.05;
    if(!perfOn&&!slowHinted&&fps<22&&(mode==='native'||mode==='mic'||mode==='demo')){
      slowMs+=ivl;
      if(slowMs>6000){slowHinted=true;toast('The display looks slow. Try Performance: Light in the controls.',7000)}
    }else if(fps>=22)slowMs=0;
  }
  if(!(mode==='demo'||mode==='native'||analyser))return;
  if(mode==='native'&&!natSeen&&performance.now()-natStart>6000){ // radio gives silence: use the mic
    stopNative();toast('No audio from the radio output - listening via microphone');
    if(analyser)mode='mic';else{mode='none';startMicOnly()}
    return;
  }
  if(mode==='none')return;
  const now=performance.now(),dt=Math.min(0.1,(now-lastNow)/1000);lastNow=now;
  const t=now/1000,n=S.bars;
  const raw=mode==='demo'?demoSpectrum(n):rawSpectrum(n);
  let mx=0;for(let i=0;i<n;i++)if(raw[i]>mx)mx=raw[i];

  // auto gain: fast attack, slow release, holds during silence so noise isn't amplified
  if(mode==='demo')gEff=1;
  else{
    agRef=mx>agRef?agRef+(mx-agRef)*0.3:agRef+(mx-agRef)*0.004;
    const tgt=S.auto?(mx>0.03?Math.min(6,Math.max(0.5,0.85/Math.max(agRef,0.04))):gEff):S.gain;
    gEff+=(tgt-gEff)*0.05;
  }
  // idle: nothing playing -> gentle ambient motion, later dim the screen
  const active=mode==='demo'||mx*gEff>0.06;
  idleT=active?0:idleT+dt;
  idleMix+=((idleT>2?1:0)-idleMix)*0.03;
  const dim=idleT>45?Math.min(0.6,(idleT-45)/30*0.6):0;
  cv.style.opacity=1-dim;$('idle').style.opacity=idleMix*0.55;

  if(vals.length!==n){vals=new Array(n).fill(0);peaks=new Array(n).fill(0)}
  let bsum=0,bc=Math.max(2,Math.round(n*0.1)),top=0,topI=0;
  for(let i=0;i<n;i++){
    const amb=(0.05+0.04*Math.sin(t*0.9+i*0.35)+0.03*Math.sin(t*0.5-i*0.2))*idleMix;
    const tgt=Math.max(Math.min(1,raw[i]*gEff),amb);
    vals[i]=tgt>vals[i]?vals[i]+(tgt-vals[i])*0.7:vals[i]+(tgt-vals[i])*0.18;
    peaks[i]=Math.max(vals[i],peaks[i]-0.006);
    if(i<bc)bsum+=vals[i];
    if(vals[i]>top){top=vals[i];topI=i}
  }
  bass=bsum/bc;bassAvg=bassAvg*0.92+bass*0.08;
  if(bass>bassAvg*1.25&&bass>0.25)flash=1;flash*=0.9;

  if(badgeOn&&(badgeN=(badgeN+1)%20)===0)$('badge').textContent=(mode==='native'?'direct audio':mode==='mic'?'microphone':mode)+' | raw peak '+mx.toFixed(2)+' | gain '+gEff.toFixed(1)+(idleT>2?' | idle':'')+' | fps '+Math.round(fps)+(perfOn?' | light':'')+(npVia?' | media '+npVia:'');

  ctx.fillStyle='rgba(5,6,10,0.35)';ctx.fillRect(0,0,W,H);
  const th=themes[S.theme],gh=th.a+(th.b-th.a)*0.3;
  const gr=ctx.createRadialGradient(W/2,H*0.6,0,W/2,H*0.6,Math.max(W,H)*0.6);
  gr.addColorStop(0,`hsla(${gh},90%,55%,${0.05+flash*0.25})`);gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);

  switch(S.style){
    case 2:return drawRadial(n);
    case 3:return drawWave(n);
    case 4:return drawTunnel(n,dt,now,topI);
    case 5:return drawGauge(n);
    case 6:return drawWaterfall(n,dt);
    case 7:return drawParticles(n,dt,now);
    default:return drawBars(n,S.style===1);
  }
}
function drawBars(n,mirror){
  const gap=W*0.004,bw=(W-gap*(n+1))/n,base=mirror?H*0.5:H*0.92,maxH=mirror?H*0.4:H*0.8;
  for(let i=0;i<n;i++){
    const x=gap+i*(bw+gap),h=Math.max(2*dpr,vals[i]*maxH),hh=hue(i,n);
    const g=ctx.createLinearGradient(0,base-h,0,base);
    g.addColorStop(0,`hsl(${hh},95%,65%)`);g.addColorStop(1,`hsl(${hh+30},90%,45%)`);
    ctx.fillStyle=g;ctx.shadowColor=`hsl(${hh},100%,60%)`;ctx.shadowBlur=(8+flash*18)*dpr;
    ctx.fillRect(x,base-h,bw,h);
    if(mirror)ctx.fillRect(x,base,bw,h*0.9);
    ctx.shadowBlur=0;ctx.fillStyle='#fff';
    const ph=peaks[i]*maxH;ctx.fillRect(x,base-ph-4*dpr,bw,3*dpr);
    if(mirror)ctx.fillRect(x,base+ph*0.9+dpr,bw,3*dpr);
  }
}
function drawRadial(n){
  const cx=W/2,cy=H/2,r0=Math.min(W,H)*(0.2+flash*0.03),rm=Math.min(W,H)*0.3;
  ctx.lineWidth=Math.max(2,(Math.PI*2*r0/n)*0.6);ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2-Math.PI/2,l=vals[i]*rm+4*dpr;
    ctx.strokeStyle=`hsl(${hue(i,n)},95%,62%)`;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=(8+flash*18)*dpr;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*(r0+l),cy+Math.sin(a)*(r0+l));ctx.stroke();
  }
  ctx.shadowBlur=0;
}
function drawWave(n){
  const cy=H*0.5,amp=H*0.4;
  const g=ctx.createLinearGradient(0,0,W,0);
  for(let k=0;k<=6;k++)g.addColorStop(k/6,`hsl(${hue(k,6)},95%,62%)`);
  ctx.lineWidth=(3+flash*3)*dpr;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.shadowColor=`hsl(${hue(n*0.4,n)},100%,60%)`;ctx.shadowBlur=(14+flash*20)*dpr;
  for(const dir of [1,-1]){
    const pt=i=>[i/(n-1)*W,cy-dir*(vals[i]*amp+2*dpr)];
    ctx.beginPath();let p=pt(0);ctx.moveTo(p[0],p[1]);
    for(let i=1;i<n;i++){const q=pt(i),mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;ctx.quadraticCurveTo(p[0],p[1],mx,my);p=q}
    ctx.lineTo(p[0],p[1]);
    ctx.strokeStyle=g;ctx.globalAlpha=dir===1?1:0.55;ctx.stroke();
    ctx.lineTo(W,cy);ctx.lineTo(0,cy);ctx.closePath();ctx.fillStyle=g;ctx.globalAlpha=0.12;ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}
function drawTunnel(n,dt,now,topI){
  const cx=W/2,cy=H/2,R=Math.max(W,H)*0.75;
  let mid=0,mc=0;for(let i=Math.floor(n*0.3);i<Math.floor(n*0.7);i++){mid+=vals[i];mc++}mid/=Math.max(1,mc);
  if((flash>0.6&&now-lastSpawn>130)||now-lastSpawn>1400){rings.push({r:0.02,h:hue(topI,n)});lastSpawn=now}
  if(rings.length>40)rings.shift();
  ctx.lineCap='butt';
  for(let k=rings.length-1;k>=0;k--){
    const g=rings[k];
    g.r+=(0.004+bass*0.02)*(1+g.r*4)*dt*60;
    if(g.r>1){rings.splice(k,1);continue}
    ctx.lineWidth=(2+(1-g.r)*16*(0.4+mid))*dpr;
    ctx.strokeStyle=`hsla(${g.h},95%,60%,${(1-g.r)*0.9})`;
    ctx.shadowColor=`hsl(${g.h},100%,60%)`;ctx.shadowBlur=10*dpr;
    ctx.beginPath();ctx.arc(cx,cy,g.r*R,0,Math.PI*2);ctx.stroke();
  }
  const cr=Math.min(W,H)*(0.05+bass*0.09);
  ctx.shadowColor=`hsl(${hue(topI,n)},100%,60%)`;ctx.shadowBlur=(20+flash*30)*dpr;
  ctx.fillStyle=`hsl(${hue(topI,n)},95%,${55+flash*20}%)`;
  ctx.beginPath();ctx.arc(cx,cy,cr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}

// two analog VU meters: left follows the bass and low mids, right follows the highs
let needle=[0,0];
function drawGauge(n){
  const R=Math.min(W*0.215,H*0.42),cy=H*0.62,cxs=[W*0.27,W*0.73],a0=Math.PI*1.12,a1=Math.PI*1.88;
  const bands=[[0,0.3],[0.55,1]],names=['BASS','TREBLE'];
  ctx.textAlign='center';ctx.lineCap='round';
  for(let k=0;k<2;k++){
    const cx=cxs[k];let s=0,c=0;
    for(let i=Math.floor(n*bands[k][0]);i<Math.ceil(n*bands[k][1]);i++){s+=vals[i];c++}
    const lv=Math.min(1,(c?s/c:0)*1.9+(k===0?bass*0.3:0));
    needle[k]+=(lv-needle[k])*(lv>needle[k]?0.35:0.09);
    const a=a0+(a1-a0)*needle[k],h=hue(k*(n-1),n);
    ctx.shadowBlur=0;
    ctx.lineWidth=R*0.05;ctx.strokeStyle='rgba(255,255,255,.14)';
    ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.stroke();
    ctx.lineWidth=R*0.07;ctx.strokeStyle=`hsl(${h},95%,60%)`;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=(10+flash*14)*dpr;
    ctx.beginPath();ctx.arc(cx,cy,R*0.97,a0,a);ctx.stroke();
    ctx.shadowBlur=0;
    for(let j=0;j<=10;j++){ // scale ticks, the last three are the "hot" zone
      const ta=a0+(a1-a0)*j/10,r1=R*0.88,r2=R*(j%5===0?0.7:0.78);
      ctx.lineWidth=R*(j%5===0?0.035:0.022);ctx.strokeStyle=j>=8?'#ff4d4d':'rgba(255,255,255,.75)';
      ctx.beginPath();ctx.moveTo(cx+Math.cos(ta)*r1,cy+Math.sin(ta)*r1);ctx.lineTo(cx+Math.cos(ta)*r2,cy+Math.sin(ta)*r2);ctx.stroke();
    }
    ctx.strokeStyle='#fff';ctx.lineWidth=R*0.04;ctx.shadowColor=`hsl(${h},100%,60%)`;ctx.shadowBlur=(12+flash*10)*dpr;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R*0.86,cy+Math.sin(a)*R*0.86);ctx.stroke();
    ctx.shadowBlur=0;ctx.fillStyle='#1b2030';ctx.strokeStyle='#fff';ctx.lineWidth=R*0.02;
    ctx.beginPath();ctx.arc(cx,cy,R*0.08,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.font=`600 ${Math.round(R*0.11)}px system-ui,sans-serif`;
    ctx.fillText(names[k],cx,cy+R*0.34);
  }
}
// scrolling spectrogram: time runs right to left, low notes at the bottom
let wfc=null,wfx=null;
function drawWaterfall(n,dt){
  if(!wfc||wfc.width!==W||wfc.height!==H){wfc=document.createElement('canvas');wfc.width=W;wfc.height=H;wfx=wfc.getContext('2d');wfx.fillStyle='#05060a';wfx.fillRect(0,0,W,H)}
  const step=Math.max(1,Math.round(3*dpr*dt*60)),th=themes[S.theme],rh=H/n;
  wfx.drawImage(wfc,-step,0);
  for(let i=0;i<n;i++){
    const v=Math.min(1,vals[i]);
    wfx.fillStyle=`hsl(${th.a+(th.b-th.a)*Math.min(1,v*1.1)},95%,${3+v*60}%)`;
    wfx.fillRect(W-step,H-(i+1)*rh,step,rh+1);
  }
  ctx.globalAlpha=1;ctx.drawImage(wfc,0,0);
}
// sparks rise from the spectrum and the kick throws a burst from the middle
let parts=[];
function drawParticles(n,dt,now){
  const cx=W/2,cy=H*0.5,base=Math.min(W,H);
  if(flash>0.6&&now-lastSpawn>110){
    lastSpawn=now;const cnt=Math.round((26+bass*40)*(perfOn?0.5:1));
    for(let k=0;k<cnt;k++){const a=Math.random()*Math.PI*2,sp=(0.25+Math.random()*0.9)*base*(0.5+bass);
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:0.35+Math.random()*0.5,h:hue(Math.random()*n,n),s:(2+Math.random()*4)*dpr})}
  }
  const stepI=Math.max(1,Math.floor(n/24));
  for(let i=0;i<n;i+=stepI){
    if(Math.random()<vals[i]*(perfOn?0.25:0.5)*dt*60)parts.push({x:(i+0.5)/n*W,y:H*0.96,vx:(Math.random()-0.5)*base*0.08,vy:-(0.25+vals[i]*0.9)*base*(0.7+Math.random()*0.6),life:1,dec:0.4+Math.random()*0.5,h:hue(i,n),s:(1.5+Math.random()*3)*dpr});
  }
  const pmax=perfOn?220:600;if(parts.length>pmax)parts.splice(0,parts.length-pmax);
  ctx.globalCompositeOperation='lighter';
  for(let k=parts.length-1;k>=0;k--){
    const p=parts[k];p.life-=p.dec*dt;if(p.life<=0){parts.splice(k,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=base*0.45*dt;p.vx*=0.995;
    ctx.fillStyle=`hsla(${p.h},95%,60%,${p.life*0.85})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.s*(0.4+p.life),0,Math.PI*2);ctx.fill();
  }
  const cr=base*(0.05+bass*0.1),g=ctx.createRadialGradient(cx,cy,0,cx,cy,cr*2.2);
  g.addColorStop(0,`hsla(${hue(0,n)},95%,65%,${0.55+flash*0.4})`);g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,cr*2.2,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

// ---------- now playing (song info + play / pause / next / previous from whatever app is playing) ----------
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
let np={title:'',artist:'',album:'',app:'',playing:false,art:'',pos:-1,dur:0,speed:0,t0:0}; // pos / dur in ms, speed 1 while playing, t0 = when pos was measured
const pad2=n=>String(n).padStart(2,'0');
function fmtT(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+':'+pad2(m)+':'+pad2(s%60):m+':'+pad2(s%60)}
function npTick(){ // runs twice a second: moves the bar between the updates the phone sends
  if(!(np.dur>0&&np.pos>=0))return;
  const cur=Math.min(np.dur,np.pos+(performance.now()-np.t0)*np.speed);
  $('npe').textContent=fmtT(cur);$('npd').textContent=fmtT(np.dur);
  $('npfill').style.width=(100*cur/np.dur).toFixed(1)+'%';
}
setInterval(()=>{if(!document.hidden&&$('np').classList.contains('hasprog'))npTick()},500);
function setAccent(){const t=themes[S.theme];document.documentElement.style.setProperty('--acc',`hsl(${t.a+(t.b-t.a)*0.35},90%,62%)`)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const natMedia=(m,o)=>window.Capacitor.nativePromise('SpectMedia',m,o||{});
function npRender(){
  const has=!!(np.title||np.artist);
  $('np').classList.toggle('bare',!has);
  $('np').classList.toggle('hasprog',has&&np.dur>0&&np.pos>=0);
  npTick();
  $('np').style.display=(!has&&!window.Capacitor)?'none':''; // the bare buttons only make sense inside the app
  $('np').classList.toggle('paused',!np.playing);
  $('npt').textContent=np.title;
  $('npa').textContent=[np.artist,np.album].filter(Boolean).join(' • ');
  $('npapp').textContent=np.app;
  $('pp').innerHTML=np.playing?ICON_PAUSE:ICON_PLAY;
  const img=$('npart');
  if(np.art){img.src='data:image/jpeg;base64,'+np.art;img.style.display='block'}else{img.removeAttribute('src');img.style.display='none'}
}
// the "Album" theme: pick the dominant colour of the cover art
function artTheme(){
  const A=themes[themes.length-1];
  if(!np.art){A.a=200;A.b=260;setAccent();return}
  const im=new Image();
  im.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(im,0,0,24,24);
      const d=x.getImageData(0,0,24,24).data;let sx=0,sy=0,tw=0;
      for(let i=0;i<d.length;i+=4){
        const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0,w=sat*mx;
        if(w<0.08)continue;
        let h=mx===mn?0:mx===r?((g-b)/(mx-mn))%6:mx===g?(b-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;h*=60*Math.PI/180;
        sx+=Math.cos(h)*w;sy+=Math.sin(h)*w;tw+=w;
      }
      if(tw>1){const h=(Math.atan2(sy,sx)*180/Math.PI+360)%360;A.a=h-30;A.b=h+50;setAccent()}
    }catch(_){}
  };
  im.src='data:image/jpeg;base64,'+np.art;
}
function npApply(e){
  if(e.active===false){np.title=np.artist=np.album=np.app='';np.playing=false;np.art='';np.pos=-1;np.dur=0;np.speed=0;artTheme()}
  else{
    np.title=e.title||'';np.artist=e.artist||'';np.album=e.album||'';np.app=e.app||'';np.playing=!!e.playing;
    np.pos=typeof e.pos==='number'?e.pos:-1;np.dur=e.dur||0;np.speed=e.speed||0;np.t0=performance.now();
  }
  if(typeof e.art==='string'){np.art=e.art;artTheme()}
  npRender();
}
async function npInit(){
  for(let i=0;i<50&&!(window.Capacitor&&window.Capacitor.nativePromise&&window.Capacitor.addListener);i++)await sleep(100);
  const C=window.Capacitor;if(!C||!C.nativePromise||!C.addListener)return;
  C.addListener('SpectMedia','media',npApply);
  for(;;){ // song info needs "Notification access"; keep checking so it starts as soon as the user switches it on
    let en=false;
    try{en=!!(await natMedia('start')).enabled}catch(_){}
    $('npen').style.display=en?'none':'';
    await sleep(en?6000:2500);
  }
}
let npVia=''; // how the last button press was sent: "session" (the app's own controls) or "key" (media key)
function npControl(a){
  if(a==='toggle'){
    if(np.pos>=0){np.pos=np.pos+(performance.now()-np.t0)*np.speed;np.t0=performance.now()} // freeze or resume the bar right away
    np.playing=!np.playing;np.speed=np.playing?1:0;npRender();
  }
  if(window.Capacitor&&window.Capacitor.nativePromise)natMedia('control',{action:a}).then(r=>{npVia=(r&&r.via)||''}).catch(()=>{});
}
$('prev').onclick=()=>npControl('prev');
$('pp').onclick=()=>npControl('toggle');
$('next').onclick=()=>npControl('next');
$('npen').onclick=async()=>{
  let ok=false;try{ok=!!(await natMedia('openSettings')).opened}catch(_){}
  toast(ok?'Switch on '+document.title+'. If it is greyed out: App info > menu > Allow restricted settings'
          :'No notification-access screen on this radio. The play, next and previous buttons still work.',8000);
};
setAccent();
npRender();
npInit();

// ---------- clock (small and dim, top right) ----------
const clockFmt=new Intl.DateTimeFormat([],{hour:'numeric',minute:'2-digit'}); // follows the radio's 12 / 24 hour setting
let lastClock='';
function tickClock(){
  const el=$('clock');el.style.display=S.clock?'':'none';
  if(!S.clock)return;
  const t=clockFmt.format(new Date());
  if(t!==lastClock){lastClock=t;el.textContent=t}
}
tickClock();setInterval(tickClock,1000);

// ---------- performance: Light = ~30 fps, lower resolution, no glow, fewer particles ----------
function applyPerf(){
  perfOn=!!S.perf;
  document.body.classList.toggle('perf',perfOn);
  if(perfOn)Object.defineProperty(ctx,'shadowBlur',{configurable:true,get(){return 0},set(v){}}); // glow is the costliest canvas effect
  else delete ctx.shadowBlur;
  resize();wfc=null;
}
applyPerf();

draw();
if(window.Capacitor)startAuto(); // auto-start inside the Android app

// ---------- controls ----------
$('gain').oninput=e=>{S.gain=+e.target.value;S.auto=false;gEff=S.gain;syncUI();save()};
$('auto').onclick=()=>{S.auto=!S.auto;syncUI();save();toast('Auto gain '+(S.auto?'on':'off'))};
$('bars').oninput=e=>{S.bars=+e.target.value;vals=[];peaks=[];save()};
function changeStyle(d){S.style=(S.style+d+styles.length)%styles.length;rings=[];parts=[];wfc=null;ctx.clearRect(0,0,W,H);syncUI();save();toast('Style: '+styles[S.style])}
function changeTheme(d){S.theme=(S.theme+d+themes.length)%themes.length;setAccent();syncUI();save();toast('Theme: '+themes[S.theme].n)}
$('style').onclick=()=>changeStyle(1);
$('theme').onclick=()=>changeTheme(1);
$('src').onclick=toggleSource;
$('perf').onclick=()=>{S.perf=!S.perf;save();applyPerf();syncUI();toast(S.perf?'Performance: Light (lower detail, smoother on slow screens)':'Performance: Normal')};
$('clk').onclick=()=>{S.clock=!S.clock;save();tickClock();syncUI();toast('Clock '+(S.clock?'on':'off'))};
$('full').onclick=()=>{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen&&d.requestFullscreen())};

let hideT;function hideLater(){clearTimeout(hideT);$('bar').classList.remove('hide');$('np').classList.add('ctl');$('clock').classList.add('hi');hideT=setTimeout(()=>{$('bar').classList.add('hide');$('np').classList.remove('ctl');$('clock').classList.remove('hi')},6000)}
['pointerdown','pointermove','keydown'].forEach(ev=>addEventListener(ev,()=>{if($('start').style.display!=='flex')hideLater()}));
// long-press on the picture (not on the controls) toggles the small debug badge
let lpT,sw=null;
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('#bar,#start,#np'))return;
  clearTimeout(lpT);lpT=setTimeout(()=>{badgeOn=!badgeOn;$('badge').textContent='';toast('Debug info '+(badgeOn?'on':'off'))},900);
  sw={x:e.clientX,y:e.clientY,t:performance.now()};
});
['pointerup','pointercancel','pointermove'].forEach(ev=>addEventListener(ev,()=>clearTimeout(lpT)));
// swipe left / right = next / previous style, swipe up / down = next / previous theme
addEventListener('pointerup',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,ms=performance.now()-sw.t;sw=null;
  if(ms>800||$('start').style.display==='flex')return;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)changeStyle(dx<0?1:-1);
  else if(Math.abs(dy)>70&&Math.abs(dy)>Math.abs(dx)*1.6)changeTheme(dy<0?1:-1);
});
addEventListener('pointercancel',()=>{sw=null});
addEventListener('visibilitychange',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()});
})();
</script>
</body>
